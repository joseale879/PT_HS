# Broker de desarrollo local. En producción se debe activar autenticación y TLS.
listener 1883
allow_anonymous true
# Desarrollo local controlado. En produccion: allow_anonymous false,
# password_file, acl_file y listener TLS obligatorios.
persistence true
persistence_location /mosquitto/data/
autosave_interval 30
connection_messages true
retain_available true
max_queued_messages 1000
max_inflight_messages 20
log_dest stdout
