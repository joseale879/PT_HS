  # 1. Refresh Materialized Views (analytics_support)
  - changeSet:
      id: a1b2c3d4-prc-001-refresh-mv
      author: Hidro_Smarth
      labels: "BD-01-dev,ddl,procedure,analytics_support"
      comment: Creates procedure to refresh all materialized views.
      changes:
        - sqlFile:
            path: 001_prc_refresh_materialized_views.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
      rollback:
        - sql: DROP PROCEDURE IF EXISTS analytics_support.prc_refresh_materialized_views();

  # 2. Generate Daily Summary (consumption)
  - changeSet:
      id: a1b2c3d4-prc-002-daily-summary
      author: Hidro_Smarth
      labels: "BD-01-dev,ddl,procedure,consumption"
      comment: Creates procedure to generate daily consumption summaries.
      changes:
        - sqlFile:
            path: 002_prc_generate_daily_summary.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
      rollback:
        - sql: DROP PROCEDURE IF EXISTS consumption.prc_generate_daily_summary(DATE);

  # 3. Clean Old Audit Logs (audit)
  - changeSet:
      id: a1b2c3d4-prc-003-clean-audit
      author: Hidro_Smarth
      labels: "BD-01-dev,ddl,procedure,audit"
      comment: Creates procedure to clean old audit logs.
      changes:
        - sqlFile:
            path: 003_prc_clean_old_audit_logs.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
      rollback:
        - sql: DROP PROCEDURE IF EXISTS audit.prc_clean_old_audit_logs(INTEGER, INTEGER);

  - changeSet:
