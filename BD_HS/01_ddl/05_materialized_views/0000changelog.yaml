databaseChangeLog:
  # The consumption-precision changeset rebuilds both views from 04_alter
  # before this changelog is reached. On fresh databases, drop those
  # intermediate views so their original create changesets can run.
  # Existing databases that recorded those creates keep their views intact.
  - changeSet:
      id: 20261025-reconcile-monthly-materialized-view-order
      author: Hidro_Smarth
      labels: "BD-01-dev,ddl,materialized-views,consumption,ci-fix"
      comment: "Removes the intermediate monthly materialized view created by the precision migration before its original create changeset runs."
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: "0"
            sql: SELECT COUNT(*) FROM databasechangelog WHERE id = '4252a8b3-1e8f-4a8d-a9d2-fd527ab70213' AND author = 'Hidro_Smarth'
      changes:
        - sql: DROP MATERIALIZED VIEW IF EXISTS consumption.mv_home_monthly_consumption;
      rollback:
        - sql: |
            CREATE MATERIALIZED VIEW consumption.mv_home_monthly_consumption AS
            SELECT home_id,
                   DATE_TRUNC('month', recorded_at)::DATE AS month_start,
                   SUM(consumption_m3) AS total_consumption_m3,
                   SUM(estimated_cost) AS total_cost,
                   COUNT(*) AS reading_count,
                   MAX(recorded_at) AS last_reading_at,
                   NOW() AS refreshed_at
              FROM consumption.sensor_reading
             GROUP BY home_id, DATE_TRUNC('month', recorded_at)::DATE;
        - sql: CREATE UNIQUE INDEX idx_mv_home_monthly_consumption_pk ON consumption.mv_home_monthly_consumption (home_id, month_start);
        - sql: CREATE INDEX idx_mv_home_monthly_consumption_home ON consumption.mv_home_monthly_consumption (home_id);

  - changeSet:
      id: 20261025-reconcile-hourly-materialized-view-order
      author: Hidro_Smarth
      labels: "BD-01-dev,ddl,materialized-views,consumption,ci-fix"
      comment: "Removes the intermediate hourly materialized view created by the precision migration before its original create changeset runs."
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: "0"
            sql: SELECT COUNT(*) FROM databasechangelog WHERE id = '7a2e26e5-8d0a-4f9b-c2e3-4b6d8f0a1235' AND author = 'Hidro_Smarth'
      changes:
        - sql: DROP MATERIALIZED VIEW IF EXISTS consumption.mv_hourly_consumption_avg;
      rollback:
        - sql: |
            CREATE MATERIALIZED VIEW consumption.mv_hourly_consumption_avg AS
            SELECT home_id,
                   EXTRACT(HOUR FROM recorded_at)::INTEGER AS hour,
                   ROUND(AVG(consumption_m3), 6) AS avg_consumption_m3,
                   ROUND(AVG(consumption_liters), 3) AS avg_consumption_liters,
                   COUNT(*) AS sample_count,
                   NOW() AS refreshed_at
              FROM consumption.sensor_reading
             WHERE recorded_at > NOW() - INTERVAL '30 days'
               AND consumption_m3 > 0
             GROUP BY home_id, EXTRACT(HOUR FROM recorded_at)
             ORDER BY home_id, EXTRACT(HOUR FROM recorded_at)::INTEGER;
        - sql: CREATE UNIQUE INDEX idx_mv_hourly_consumption_avg_home_hour ON consumption.mv_hourly_consumption_avg (home_id, hour);

  - changeSet:
      id: 4252a8b3-1e8f-4a8d-a9d2-fd527ab70213
      author: Hidro_Smarth
      labels: "BD-01-dev,ddl,base,materialized-views,consumption"
      comment: Creates a materialized view with monthly consumption aggregates by household.
      changes:
        - sqlFile:
            path: 001_mv_home_monthly_consumption.sql
            relativeToChangelogFile: true
            stripComments: false
      rollback:
        - sql: DROP MATERIALIZED VIEW IF EXISTS consumption.mv_home_monthly_consumption;

  - changeSet:
      id: b8f0c6d2-0e9a-4fd2-a0b5-2d75c4d0e349
      author: Hidro_Smarth
      labels: "BD-01-dev,ddl,base,materialized-views,alert"
      comment: Creates a materialized view summarizing pending alerts by household.
      changes:
        - sqlFile:
            path: 002_mv_pending_alerts.sql
            relativeToChangelogFile: true
            stripComments: false
      rollback:
        - sql: DROP MATERIALIZED VIEW IF EXISTS alert_rate.mv_pending_alerts;

  - changeSet:
      id: c3f7d0b1-9d2b-4db1-9f3a-207c9b57de93
      author: Hidro_Smarth
      labels: "BD-01-dev,ddl,base,materialized-views,device"
      comment: Creates a materialized view with active device counts and connection summary per household.
      changes:
        - sqlFile:
            path: 003_mv_active_devices.sql
            relativeToChangelogFile: true
            stripComments: false
      rollback:
        - sql: DROP MATERIALIZED VIEW IF EXISTS device.mv_active_devices;

  - changeSet:
      id: 6f1f15d4-7c9f-4e8a-b1d2-3a5c7e9f0124
      author: Hidro_Smarth
      labels: "BD-01-dev,ddl,base,materialized-views,recommendation"
      comment: Creates a materialized view summarizing recommendations by home.
      changes:
        - sqlFile:
            path: 004_mv_recommendation_summary.sql
            relativeToChangelogFile: true
