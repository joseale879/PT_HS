  - changeSet:
      id: 7a2e26e5-8d0a-4f9b-c2e3-4b6d8f0a1235
      author: Hidro_Smarth
      labels: "BD-01-dev,ddl,base,materialized-views,consumption"
      comment: Creates a materialized view with average hourly consumption for the last 30 days.
      changes:
        - sqlFile:
            path: 005_mv_hourly_consumption_avg.sql
            relativeToChangelogFile: true
            stripComments: false
      rollback:
        - sql: |
            DROP MATERIALIZED VIEW IF EXISTS consumption.mv_hourly_consumption_avg;
            CREATE MATERIALIZED VIEW consumption.mv_hourly_consumption_avg AS
            SELECT
                EXTRACT(HOUR FROM sr.recorded_at)::INTEGER AS hour,
                ROUND(AVG(sr.consumption_m3)::NUMERIC, 4) AS avg_consumption_m3,
                ROUND(AVG(sr.consumption_liters)::NUMERIC, 2) AS avg_consumption_liters,
                COUNT(*) AS sample_count,
                NOW() AS refreshed_at
            FROM consumption.sensor_reading sr
            WHERE sr.recorded_at > NOW() - INTERVAL '30 days'
              AND sr.consumption_m3 > 0
            GROUP BY EXTRACT(HOUR FROM sr.recorded_at)
            ORDER BY hour;
            CREATE UNIQUE INDEX idx_mv_hourly_consumption_avg_hour
                ON consumption.mv_hourly_consumption_avg (hour);

  - changeSet:
      id: 20260824-mv-hourly-by-home
      author: Hidro_Smarth
      comment: "Prevents hourly consumption analytics from mixing data between homes."
      changes:
        - sqlFile:
            path: 006_mv_hourly_consumption_by_home.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
      rollback:
        - sql: |
            DROP MATERIALIZED VIEW IF EXISTS consumption.mv_hourly_consumption_avg;
            CREATE MATERIALIZED VIEW consumption.mv_hourly_consumption_avg AS
            SELECT
                EXTRACT(HOUR FROM sr.recorded_at)::INTEGER AS hour,
                ROUND(AVG(sr.consumption_m3)::NUMERIC, 4) AS avg_consumption_m3,
                ROUND(AVG(sr.consumption_liters)::NUMERIC, 2) AS avg_consumption_liters,
                COUNT(*) AS sample_count,
                NOW() AS refreshed_at
            FROM consumption.sensor_reading sr
            WHERE sr.recorded_at > NOW() - INTERVAL '30 days'
              AND sr.consumption_m3 > 0
            GROUP BY EXTRACT(HOUR FROM sr.recorded_at)
            ORDER BY hour;
            CREATE UNIQUE INDEX idx_mv_hourly_consumption_avg_hour
                ON consumption.mv_hourly_consumption_avg (hour);

  - changeSet:
      id: 20260825-mv-monthly-all-history
      author: Hidro_Smarth
      labels: "BD-01-dev,ddl,materialized-views,consumption"
      comment: "Removes the hard-coded 2024 cutoff from monthly consumption reporting."
      changes:
        - sqlFile:
            path: 007_mv_home_monthly_all_history.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/05_materialized_views/007_mv_home_monthly_all_history.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
