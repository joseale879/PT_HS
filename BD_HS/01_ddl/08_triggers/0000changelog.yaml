            DROP TRIGGER IF EXISTS trg_device_updated_at ON device.device;
            DROP TRIGGER IF EXISTS trg_user_preference_updated_at ON preference.user_preference;
            DROP TRIGGER IF EXISTS trg_vacation_mode_updated_at ON home.vacation_mode;
            DROP TRIGGER IF EXISTS trg_saving_goal_updated_at ON home.saving_goal;
            DROP TRIGGER IF EXISTS trg_ticket_updated_at ON analytics_support.ticket;
            DROP TRIGGER IF EXISTS trg_role_updated_at ON user_account.role;
            DROP TRIGGER IF EXISTS trg_permission_updated_at ON user_account.permission;
            DROP TRIGGER IF EXISTS trg_password_policy_updated_at ON user_account.password_policy;
            DROP TRIGGER IF EXISTS trg_user_mfa_updated_at ON user_account.user_mfa;
            DROP TRIGGER IF EXISTS trg_language_updated_at ON preference.language;
            DROP TRIGGER IF EXISTS trg_currency_updated_at ON preference.currency;
            DROP TRIGGER IF EXISTS trg_theme_updated_at ON preference.theme;
            DROP TRIGGER IF EXISTS trg_threshold_configuration_updated_at ON alert_rate.threshold_configuration;
            DROP TRIGGER IF EXISTS trg_alert_rule_updated_at ON alert_rate.alert_rule;
            DROP TRIGGER IF EXISTS trg_home_rate_updated_at ON alert_rate.home_rate;
            DROP TRIGGER IF EXISTS trg_recommendation_category_updated_at ON analytics_support.recommendation_category;
            DROP TRIGGER IF EXISTS trg_recommendation_updated_at ON analytics_support.recommendation;
            DROP TRIGGER IF EXISTS trg_arco_request_updated_at ON privacy.arco_request;
            DROP FUNCTION IF EXISTS public.fn_update_updated_at();

