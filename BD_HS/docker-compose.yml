name: hidro_smart

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hidro_smart}
      POSTGRES_USER: ${POSTGRES_USER:-hidro_smart_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set_POSTGRES_PASSWORD_in_env}
    ports:
      - "${POSTGRES_PORT:-5433}:${POSTGRES_INTERNAL_PORT:-5432}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-hidro_smart_admin} -d ${POSTGRES_DB:-hidro_smart}
      interval: 5s
      timeout: 5s
      retries: 10

  db-bootstrap:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-hidro_smart}
      PGUSER: ${POSTGRES_USER:-hidro_smart_admin}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set_POSTGRES_PASSWORD_in_env}
      APP_PASSWORD: ${DB_PASSWORD:?Set_DB_PASSWORD_in_env}
      INGEST_PASSWORD: ${DB_INGEST_PASSWORD:?Set_DB_INGEST_PASSWORD_in_env}
      LIQUIBASE_PASSWORD: ${LIQUIBASE_PASSWORD:?Set_LIQUIBASE_PASSWORD_in_env}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        if ! psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'hidro_smart_app'" | grep -q 1; then
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE hidro_smart_app LOGIN;"
        fi
        psql -v ON_ERROR_STOP=1 -c "ALTER ROLE hidro_smart_app LOGIN PASSWORD '$${APP_PASSWORD}';"
        if ! psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'hidro_smart_ingest'" | grep -q 1; then
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE hidro_smart_ingest LOGIN;"
        fi
        psql -v ON_ERROR_STOP=1 -c "ALTER ROLE hidro_smart_ingest LOGIN PASSWORD '$${INGEST_PASSWORD}';"
        if ! psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'hidro_smart_liquibase'" | grep -q 1; then
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE hidro_smart_liquibase LOGIN;"
        fi
        psql -v ON_ERROR_STOP=1 -c "ALTER ROLE hidro_smart_liquibase LOGIN PASSWORD '$${LIQUIBASE_PASSWORD}';"
        psql -v ON_ERROR_STOP=1 -c "ALTER ROLE hidro_smart_liquibase CREATEROLE;"
        psql -v ON_ERROR_STOP=1 -c "GRANT CONNECT ON DATABASE \"$${PGDATABASE}\" TO hidro_smart_liquibase;"
        psql -v ON_ERROR_STOP=1 -c "GRANT CREATE ON DATABASE \"$${PGDATABASE}\" TO hidro_smart_liquibase;"
        psql -v ON_ERROR_STOP=1 -c "GRANT USAGE, CREATE ON SCHEMA public TO hidro_smart_liquibase;"
    restart: "no"

  liquibase:
    build:
      context: .
      dockerfile: docker/liquibase/Dockerfile
    image: hidro-smart-liquibase:5.0.2
    profiles:
      - tooling
    depends_on:
      postgres:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
    working_dir: /workspace
    volumes:
      - ./:/workspace
    entrypoint:
      - liquibase
      - --search-path=/workspace
      - --changeLogFile=changelog-master.yaml
      - --classpath=/liquibase/liquibase_libs/postgresql-42.7.8.jar
      - --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hidro_smart}
      - --username=${LIQUIBASE_USER:?Set_LIQUIBASE_USER_in_env}
      - --password=${LIQUIBASE_PASSWORD:?Set_LIQUIBASE_PASSWORD_in_env}

volumes:
  postgres_data:
