  - changeSet:
      id: 20260823-registration-function-grant
      author: Hidro_Smarth
      comment: "Allows the application to register users through the controlled function instead of direct INSERT RETURNING."
      changes:
        - sql: |
            REVOKE INSERT ON user_account.user_account FROM hidro_smart_app;
            GRANT EXECUTE ON FUNCTION user_account.fn_register_user(VARCHAR, VARCHAR) TO hidro_smart_app;
            GRANT EXECUTE ON FUNCTION home.fn_create_home_with_owner(VARCHAR, VARCHAR, VARCHAR, SMALLINT, UUID) TO hidro_smart_app;
      rollback:
        - sql: |
            REVOKE EXECUTE ON FUNCTION user_account.fn_register_user(VARCHAR, VARCHAR) FROM hidro_smart_app;
            REVOKE EXECUTE ON FUNCTION home.fn_create_home_with_owner(VARCHAR, VARCHAR, VARCHAR, SMALLINT, UUID) FROM hidro_smart_app;
            GRANT INSERT ON user_account.user_account TO hidro_smart_app;

  - changeSet:
      id: 20260824-security-hardening
      author: Hidro_Smarth
      comment: "Restricts reporting access to secrets and removes PUBLIC execution from privileged functions."
      changes:
        - sqlFile:
            path: 004_security_hardening.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: false
      rollback:
        - sql: |
            GRANT SELECT ON user_account.user_credential, user_account.password_reset_token, user_account.token, user_account.session, user_account.user_mfa, user_account.login_attempt, user_account.role_permission, privacy.user_consent, privacy.arco_request, audit.audit_log, audit.log_error TO hidro_smart_readonly;
            GRANT SELECT ON user_account.user_credential, user_account.password_reset_token, user_account.token, user_account.user_mfa TO hidro_smart_app;
            GRANT EXECUTE ON FUNCTION user_account.fn_register_user(VARCHAR, VARCHAR) TO PUBLIC;
            GRANT EXECUTE ON FUNCTION home.fn_create_home_with_owner(VARCHAR, VARCHAR, VARCHAR, SMALLINT, UUID) TO PUBLIC;
            GRANT EXECUTE ON FUNCTION consumption.fn_calculate_cost(DECIMAL, UUID, DATE) TO PUBLIC;

